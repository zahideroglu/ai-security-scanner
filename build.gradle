plugins {
    id 'java'
}

group = 'com.security'
version = '2.1'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

dependencies {
    // JSON processing
    implementation 'org.json:json:20231013'
    
    // SQLite JDBC
    implementation 'org.xerial:sqlite-jdbc:3.44.1.0'
    
    // Burp API (Maven'dan indir)
    compileOnly 'net.portswigger.burp.extender:burp-extender-api:2.3'

    // Test Dependencies
    testImplementation 'net.portswigger.burp.extender:burp-extender-api:2.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.8.0'
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'AppSecHunter',
            'Implementation-Version': version,
            'Implementation-Vendor': 'Zahid Eroglu',
            'Built-By': System.getProperty('user.name'),
            'Built-JDK': System.getProperty('java.version')
        )
    }
    
    // Include dependencies
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    archiveBaseName = 'appsechunter'
    archiveVersion = version
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}